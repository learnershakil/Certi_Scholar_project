[project]
name = "certischolar-ocr"
version = "0.1.0"
description = "Internal Python OCR Microservice with Google Cloud Vision & Tesseract Providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pytesseract>=0.3.10",
    "pillow>=10.4.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.9",
    "google-cloud-documentai>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
